name: pr-gate
on:
  workflow_call:
    inputs:
      check: { type: string, required: true }
    outputs:
      run:
        description: "'true' when the calling check should run in this repository"
        value: ${{ jobs.gate.outputs.run }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        uses: actions/github-script@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          POLICY: ${{ vars.PR_CHECKS }}
          CHECK: ${{ inputs.check }}
        with:
          script: |
            const raw = process.env.POLICY ?? '';
            let policy = {};
            if (raw.trim() === '') {
              // Either unset, or not visible to this run. Logged distinctly so the
              // first bridged PR answers whether repo variables reach fork-triggered runs.
              core.warning('PR_CHECKS is empty or not visible to this run; running the check.');
            } else {
              try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) policy = parsed;
                else core.warning('PR_CHECKS is not a JSON object; running the check.');
              } catch (e) {
                core.warning(`PR_CHECKS is not valid JSON, running the check: ${e.message}`);
              }
            }

            const check = process.env.CHECK;
            const self = `${context.repo.owner}/${context.repo.repo}`;
            const head = context.payload.pull_request?.head?.repo?.full_name ?? self;
            const checks = policy.checks && typeof policy.checks === 'object' ? policy.checks : {};
            let mode = checks[check] ?? policy.default ?? 'always';
            if (!['always', 'off', 'skip-bridged'].includes(mode)) {
              core.warning(`Unknown mode "${mode}" for ${check}, treating as always.`);
              mode = 'always';
            }
            const bridgedList = Array.isArray(policy.bridged) ? policy.bridged : [];
            const bridged = bridgedList.some((r) => String(r).toLowerCase() === head.toLowerCase());
            const run = mode === 'always' || (mode === 'skip-bridged' && !bridged);

            core.info(`repo=${self} check=${check} head=${head} policy=${raw.trim() ? 'set' : 'empty'} mode=${mode} bridged=${bridged} -> run=${run}`);
            core.setOutput('run', String(run));
