name: build-scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 1,2,3,4,5'

jobs:
  build:
    name: Build code base & SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check node version
        run: node --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Check mvn version
        run: mvn --version

      - name: Install MTA Build Tool
        run: npm install -g mbt

      - name: Install Packages
        run: npm install ci

      - name: Disable package-lock.json
        run: npm config set package-lock false

      - name: Build MTA
        run: npm run build

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            libgtk-3-0 \
            libgbm-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            xvfb

      - name: Install E2E dependencies
        working-directory: asint_ais_e2e
        run: npm ci

      - name: Clean old Allure results
        run: |
          rm -rf asint_ais_e2e/allure-results
          rm -rf asint_ais_e2e/allure-report
          rm -rf gh-pages

      - name: Run WDIO tests in parallel (4 workers)
        working-directory: asint_ais_e2e
        env:
          CI: true
          SAP_USERNAME: ${{ secrets.SAP_USERNAME }}
          SAP_PASSWORD: ${{ secrets.SAP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: npx wdio run wdio.conf.ts --maxInstances 4
        continue-on-error: true

      - name: Download previous Allure history
        if: always()
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }} gh-pages || true
          mkdir -p asint_ais_e2e/allure-results/history
          cp -r gh-pages/history/* asint_ais_e2e/allure-results/history || true

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate asint_ais_e2e/allure-results --clean -o asint_ais_e2e/allure-report

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: asint_ais_e2e/allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./asint_ais_e2e/allure-report
          force_orphan: true

      - name: Add report link to workflow summary
        if: always()
        run: |
          echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "Open report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

      - name: SonarQube Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_USER_HOME: ${{ github.workspace }}/.sonar
