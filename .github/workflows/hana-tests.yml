# Manual workflow to run HANA-specific tests
name: HANA Tests

on:
  workflow_dispatch:

jobs:
  hana-tests:
    name: Run HANA Database Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Run HANA tests
        run: mvn clean test -Phana-tests -pl asint_ais_backend -am -Denforcer.skip=true

      - name: Generate HTML test reports
        if: always()
        run: mvn surefire-report:report-only -Phana-tests -pl asint_ais_backend -am -Denforcer.skip=true
        continue-on-error: true

      - name: Upload Surefire HTML Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hana-test-reports
          path: |
            asint_ais_backend/target/reports/
          if-no-files-found: warn
          retention-days: 1

      - name: Add Test Report Summary
        if: always()
        run: |
          echo "## HANA Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 Test reports have been generated and are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To view the HTML test report:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the workflow run summary" >> $GITHUB_STEP_SUMMARY
          echo "2. Download the 'hana-test-reports' artifact" >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the ZIP file" >> $GITHUB_STEP_SUMMARY
          echo "4. Open 'index.html' in your browser" >> $GITHUB_STEP_SUMMARY


