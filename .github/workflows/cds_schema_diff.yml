name: CDS Schema Diff

on:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cds-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate-cds
    uses: ./.github/workflows/_pr_gate.yml
    with: { check: cds }

  check-schema-present:
    needs: gate
    name: Check CDS files in PR
    runs-on: ubuntu-latest
    if: needs.gate.outputs.run == 'true' && github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed or new CDS files
        id: cds-check
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-status \
            origin/${{ github.base_ref }}...HEAD \
            | awk '$1 != "D"' \
            | awk '{print $NF}' \
            | grep '\.cds$' \
            | grep -v '^asint_ais_backend/' \
            | grep -v '^asint_ais_analytics_backend/' \
            | tee cds_files.txt || true
          if [ -s cds_files.txt ]; then
            echo "=== CDS files changed or created in this PR ==="
            echo "Found CDS files (excluding backend service definitions):"
            echo "has_cds=true" >> $GITHUB_OUTPUT
            cat cds_files.txt
          else
            echo "No CDS files found in this PR (excluding backend folders)"
          fi
      # ── Only runs when CDS files found ──
      - name: Setup Node.js
        if: steps.cds-check.outputs.has_cds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDS CLI
        if: steps.cds-check.outputs.has_cds == 'true'
        run: |
          PINNED=$(node -e "
          try {
              const p = require('./package.json');
              const v = (p.devDependencies || p.dependencies || {})['@sap/cds-dk'];
              if (v) process.stdout.write(v.replace(/^[\^~]/, ''));
          } catch(_) {}
          " 2>/dev/null)
          VERSION="${PINNED:-8.5.1}"   # ← update this fallback when you want to bump
          echo "Installing @sap/cds-dk@${VERSION}"
          npm install -g @sap/cds-dk@${VERSION}
          cds --version
      - name: Compile CDS files
        if: steps.cds-check.outputs.has_cds == 'true'
        run: |
          mkdir -p /tmp/pr_csn
          while IFS= read -r file; do
            echo "=============================="
            echo "Compiling: $file"
            echo "=============================="
            # HANA validation — blocks the PR on any syntax error
            cds compile "$file" --to hana
            safe="${file//\//__}"
            if ! cds compile "$file" --to json > "/tmp/pr_csn/${safe}.json" 2>"/tmp/pr_csn/${safe}.err"; then
                echo "❌ CSN compilation failed for: $file"
                echo "--- stderr ---"
                cat "/tmp/pr_csn/${safe}.err"
                exit 1
            fi
          done < cds_files.txt
      - name: Checkout base branch
        if: steps.cds-check.outputs.has_cds == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base_repo
          fetch-depth: 1

      - name: Install base branch dependencies
        if: steps.cds-check.outputs.has_cds == 'true'
        working-directory: base_repo
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json found — skipping"
            exit 0
          fi
          npm config set cache ~/.npm
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --prefer-offline
          else
            npm install --no-audit --no-fund --prefer-offline
          fi
      - name: Compile base branch CDS to CSN
        if: steps.cds-check.outputs.has_cds == 'true'
        run: |
          mkdir -p /tmp/base_csn
          while IFS= read -r file; do
            echo "Processing base version of: $file"
            safe="${file//\//__}"
            if [ -f "base_repo/$file" ]; then
              # Run from base_repo directory to resolve relative paths correctly
              if ! (cd base_repo && cds compile "$file" --to json) > "/tmp/base_csn/${safe}.json" 2> "/tmp/base_csn/${safe}.err"; then
                echo "❌ CSN compilation failed for base version of: $file"
                echo "--- stderr ---"
                cat "/tmp/base_csn/${safe}.err"
                exit 1
              fi
            else
              # File does not exist on base branch → brand-new file in this PR
              echo "{}" > "/tmp/base_csn/${safe}.json"
            fi
          done < cds_files.txt
      - name: Show Changed Columns Only
        if: steps.cds-check.outputs.has_cds == 'true'
        uses: actions/github-script@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            const baseRef = context.payload.pull_request.base.ref;
            const cdsFiles = fs.readFileSync('cds_files.txt', 'utf8')
              .split('\n')
              .map(f => f.trim())
              .filter(f => f.length > 0);
            
            // Compares full relative paths (not just basenames) — this repo has many modules with
            // identically-named CDS files (e.g. schema.cds), so basename-only matching would wrongly
            // attribute one file's entities to another file's diff.
            function normalizeRelPath(filePath) {
              return (filePath || '').replace(/\\/g, '/').replace(/^\.\//, '');
            }
            
            function csnTypeLabel(el) {
              if (!el) return 'Unknown';
              const t = el.type || '';
            
              if (t === 'cds.Association' || t === 'cds.Composition') {
                const kind   = t === 'cds.Composition' ? 'Composition' : 'Association';
                const target = (el.target || '?').split('.').pop();
                return `${kind} to ${target}`;
              }
            
              if (t === 'cds.Decimal' || t === 'cds.DecimalFloat') {
                if (el.precision != null && el.scale != null)
                  return `Decimal(${el.precision},${el.scale})`;
                if (el.precision != null)
                  return `Decimal(${el.precision})`;
                return 'Decimal';
              }
            
              if ((t === 'cds.String' || t === 'cds.Binary') && el.length != null)
                return `${t.replace('cds.', '')}(${el.length})`;
            
              if (t.startsWith('cds.')) return t.slice(4);
            
              return t || 'Unknown';
            }
            
            function parseCsn(jsonPath, cdsFile) {
              const entities = {};
              if (!fs.existsSync(jsonPath)) return entities;
            
              const raw = fs.readFileSync(jsonPath, 'utf8');
              let csn;
              try {
                csn = JSON.parse(raw);
              } catch (err) {
                throw new Error(`Failed to parse CSN JSON at ${jsonPath}: ${err.message}`);
              }
            
              const targetPath = normalizeRelPath(cdsFile);
            
              for (const [fqName, def] of Object.entries(csn.definitions || {})) {
                if (def.kind !== 'entity') continue;
                const sourcePath = normalizeRelPath(def['$location']?.file || '');
                if (sourcePath && sourcePath !== targetPath) continue;
            
                const shortName = fqName.split('.').pop();
                const fields = {};
                for (const [elName, el] of Object.entries(def.elements || {})) {
                  if (el['@Core.Computed'] || el.virtual) continue;
                  fields[elName] = {
                    type: csnTypeLabel(el),
                    isKey: !!el.key,
                  };
                }
                if (Object.keys(fields).length > 0) {
                  entities[fqName] = { shortName, fields };
                }
              }
              return entities;
            }
            
            function classifyFields(baseFields, prFields, isNewTable) {
              const rows = [];
            
              for (const [fieldName, prInfo] of Object.entries(prFields)) {
                if (isNewTable || !Object.prototype.hasOwnProperty.call(baseFields, fieldName)) {
                  rows.push({ fieldName, type: prInfo.type, isKey: prInfo.isKey, status: 'new' });
                } else {
                  const baseInfo = baseFields[fieldName];
                  const typeChanged = baseInfo.type !== prInfo.type;
                  const keyChanged = baseInfo.isKey !== prInfo.isKey;
            
                  if (typeChanged || keyChanged) {
                    rows.push({
                      fieldName,
                      type: prInfo.type,
                      isKey: prInfo.isKey,
                      oldType: baseInfo.type,
                      oldIsKey: baseInfo.isKey,
                      status: 'modified',
                    });
                  } else {
                    rows.push({ fieldName, type: prInfo.type, isKey: prInfo.isKey, status: 'unchanged' });
                  }
                }
              }
            
              for (const [fieldName, baseInfo] of Object.entries(baseFields)) {
                if (!Object.prototype.hasOwnProperty.call(prFields, fieldName)) {
                  rows.push({ fieldName, type: baseInfo.type, isKey: baseInfo.isKey, status: 'removed' });
                }
              }
            
              return rows;
            }
            
            // Builds a structured diff for one entity instead of a flat string, so the caller can
            // decide how to lay it out across one or more PR comments without ever dropping rows.
            function buildEntityBlock(entityName, baseFields, prFields, isNewTable) {
              const allRows = classifyFields(baseFields, prFields, isNewTable);
              // Unchanged columns are the main source of report bloat — never render them, only count them
              const changedRows = allRows.filter(row => row.status !== 'unchanged');
              const unchangedCount = allRows.length - changedRows.length;
            
              if (changedRows.length === 0) return null;
            
              const title = isNewTable
                ? `#### 🆕 New Table: \`${entityName}\`\n\n`
                : `#### 🗂️ Table: \`${entityName}\`\n\n`;
              const columnHeader =
                '| # | Column Name | Data Type | Primary Key | Status |\n' +
                '|---|-------------|-----------|-------------|--------|\n';
            
              const counts = { new: 0, modified: 0, removed: 0 };
              const rowLines = changedRows.map((row, i) => {
                const num = i + 1;
                const keyMarker = row.isKey ? '🔑 Yes' : '—';
            
                if (row.status === 'new') {
                  counts.new++;
                  return `| ${num} | ✅ **\`${row.fieldName}\`** | \`${row.type}\` | ${keyMarker} | 🆕 **New** |\n`;
                }
                if (row.status === 'modified') {
                  counts.modified++;
                  const typeCell = row.oldType !== row.type
                    ? `~~\`${row.oldType}\`~~ → \`${row.type}\``
                    : `\`${row.type}\``;
                  const keyCell = row.oldIsKey !== row.isKey
                    ? `~~${row.oldIsKey ? '🔑 Yes' : '—'}~~ → ${keyMarker}`
                    : keyMarker;
                  return `| ${num} | ✏️ **\`${row.fieldName}\`** | ${typeCell} | ${keyCell} | ✏️ **Modified** |\n`;
                }
                counts.removed++;
                return `| ${num} | ~~\`${row.fieldName}\`~~ | ~~\`${row.type}\`~~ | ${keyMarker} | ❌ **Removed** |\n`;
              });
            
              const totalPr = Object.keys(prFields).length;
              let summaryLine = `\n> 📊 Total columns: **${totalPr}**`;
              if (counts.new)      summaryLine += ` &nbsp;·&nbsp; ✅ Added: **${counts.new}**`;
              if (counts.modified) summaryLine += ` &nbsp;·&nbsp; ✏️ Modified: **${counts.modified}**`;
              if (counts.removed)  summaryLine += ` &nbsp;·&nbsp; ❌ Removed: **${counts.removed}**`;
              if (unchangedCount)  summaryLine += ` &nbsp;·&nbsp; — Unchanged (not shown): **${unchangedCount}**`;
              summaryLine += '\n\n';
            
              return { title, columnHeader, rowLines, summaryLine };
            }
            
            // Each entity is reported once, under the file matching its own $location (now compared
            // by full relative path, see normalizeRelPath). An entity extended from a second changed
            // file still gets its full, merged column list diffed there — just grouped under the
            // originating file's heading — so no changes are lost, only attributed to one file.
            const reportedEntities = new Set();
            
            // Returns { fileHeading, blocks } where each block is either a full entity diff
            // ({ kind: 'entity', ... }) or a small fixed text block ({ kind: 'text', text }).
            function buildFileBlocks(cdsFile) {
              const safe = cdsFile.replace(/\//g, '__');
              const prEntities = parseCsn(`/tmp/pr_csn/${safe}.json`, cdsFile);
              const baseEntities = parseCsn(`/tmp/base_csn/${safe}.json`, cdsFile);
            
              if (Object.keys(prEntities).length === 0 && Object.keys(baseEntities).length === 0) {
                return null;
              }
            
              const renderedTables = new Set();
              const blocks = [];
            
              // Entities present in PR
              for (const [fqName, prData] of Object.entries(prEntities)) {
                if (reportedEntities.has(fqName)) continue;
            
                const baseData = baseEntities[fqName] || {};
                const isNewTable = !Object.prototype.hasOwnProperty.call(baseEntities, fqName);
                const baseFields = baseData.fields || {};
                const prFields = prData.fields;
            
                const block = buildEntityBlock(prData.shortName, baseFields, prFields, isNewTable);
                if (!block) continue;
            
                renderedTables.add(fqName);
                reportedEntities.add(fqName);
                blocks.push({ kind: 'entity', ...block });
              }
            
              // Entities fully dropped in PR
              for (const [fqName, baseData] of Object.entries(baseEntities)) {
                if (!Object.prototype.hasOwnProperty.call(prEntities, fqName)) {
                  if (renderedTables.has(fqName) || reportedEntities.has(fqName)) continue;
                  renderedTables.add(fqName);
                  reportedEntities.add(fqName);
                  blocks.push({
                    kind: 'text',
                    text: `#### 🗑️ Dropped Table: \`${baseData.shortName}\`\n\n> ❌ This entire table was removed in this PR.\n\n`,
                  });
                }
              }
            
              if (blocks.length === 0) return null;
              return { fileHeading: `### 📄 \`${cdsFile}\`\n\n`, blocks };
            }
            
            // GitHub caps a single PR comment at 65536 characters. Rather than truncating content,
            // the report is paginated across as many comments as needed so nothing is ever hidden.
            const GITHUB_COMMENT_LIMIT = 65536;
            // Reserve room for the "Part x/y" banner added to each page after pagination is decided.
            const BANNER_RESERVE = 400;
            const PAGE_BUDGET = GITHUB_COMMENT_LIMIT - BANNER_RESERVE;
            
            const pages = [[]];
            let currentLength = 0;
            
            function startNewPage() {
              pages.push([]);
              currentLength = 0;
            }
            
            function appendToPage(text) {
              pages[pages.length - 1].push(text);
              currentLength += text.length;
            }
            
            // Adds an indivisible chunk of markdown, opening a new page first if it doesn't fit.
            function addChunk(text) {
              if (currentLength > 0 && currentLength + text.length > PAGE_BUDGET) {
                startNewPage();
              }
              appendToPage(text);
            }
            
            // Adds one entity's diff, splitting it across pages (repeating the header) only if the
            // table itself is too large for a single comment — every changed column is still shown.
            function addEntityBlock(block) {
              const wholeSize = block.title.length + block.columnHeader.length +
                block.rowLines.reduce((sum, r) => sum + r.length, 0) + block.summaryLine.length;
            
              if (wholeSize <= PAGE_BUDGET) {
                addChunk(block.title + block.columnHeader + block.rowLines.join('') + block.summaryLine);
                return;
              }
            
              let continuation = false;
              let idx = 0;
              while (idx < block.rowLines.length) {
                const title = continuation ? block.title.replace('\n\n', ' (continued)\n\n') : block.title;
                addChunk(title + block.columnHeader);
            
                while (idx < block.rowLines.length) {
                  const row = block.rowLines[idx];
                  if (currentLength > 0 && currentLength + row.length > PAGE_BUDGET) break;
                  appendToPage(row);
                  idx++;
                }
            
                if (idx < block.rowLines.length) {
                  startNewPage();
                  continuation = true;
                }
              }
            
              addChunk(block.summaryLine);
            }
            
            const header = '## 🔍 CDS Column Diff — Columns Summary\n\n' +
              `> Comparing against \`${baseRef}\` · **${cdsFiles.length} CDS file(s)** affected\n` +
              '> ✅ Added &nbsp;·&nbsp; ✏️ Modified &nbsp;·&nbsp; ❌ Removed &nbsp;·&nbsp; — Unchanged\n\n' +
              '---\n\n';
            const footer = '\n---\n> ⚙️ *Auto-generated by CDS Column Diff Action*\n';
            
            addChunk(header);
            
            const uniqueFiles = [...new Set(cdsFiles)];
            let anyChanges = false;
            for (const cdsFile of uniqueFiles) {
              const fileBlocks = buildFileBlocks(cdsFile);
              if (!fileBlocks) continue;
            
              anyChanges = true;
              addChunk(fileBlocks.fileHeading);
              for (const block of fileBlocks.blocks) {
                if (block.kind === 'text') {
                  addChunk(block.text);
                } else {
                  addEntityBlock(block);
                }
              }
            }
            
            if (!anyChanges) {
              addChunk('_No column-level changes detected in the affected CDS files._\n\n');
            }
            
            addChunk(footer);
            
            const totalPages = pages.length;
            // Hidden marker used to identify (and only ever touch) this action's own comments,
            // so we never delete/update another bot's comment that happens to mention this title.
            const COMMENT_MARKER = '<!-- cds-schema-diff-bot: do not edit -->';
            const commentBodies = pages.map((segments, i) => {
              const banner = totalPages > 1
                ? `> 📄 **Part ${i + 1} of ${totalPages}** — this schema diff was split across multiple comments because it exceeds GitHub's ${GITHUB_COMMENT_LIMIT}-character comment limit.\n\n`
                : '';
              return `${COMMENT_MARKER}\n${banner}${segments.join('')}`;
            });
            
            // The job summary is a convenience copy of the same content built above (not recomputed),
            // capped conservatively below the documented 1 MiB per-step limit for job summaries.
            // See: https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#adding-a-job-summary
            const JOB_SUMMARY_LIMIT = 1000000;
            const summaryContent = commentBodies.join('\n\n');
            const summaryToWrite = summaryContent.length > JOB_SUMMARY_LIMIT
              ? summaryContent.slice(0, JOB_SUMMARY_LIMIT) + '\n\n> ⚠️ Summary truncated — report exceeded the job summary size limit.\n'
              : summaryContent;
            await core.summary.addRaw(summaryToWrite).write();
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existing = comments
              .filter(c => c.user.type === 'Bot' && c.body.includes(COMMENT_MARKER))
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            
            // Update comments in place where a prior page already exists, only creating or deleting
            // to make up the difference if the number of pages changed since the last run.
            const updateCount = Math.min(existing.length, commentBodies.length);
            for (let i = 0; i < updateCount; i++) {
              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing[i].id,
                  body: commentBodies[i],
                });
              } catch (e) {
                core.warning(`Could not update PR comment (${e.status ?? ''} ${e.message}); the result is still enforced by this job.`);
              }
            }
            for (let i = updateCount; i < commentBodies.length; i++) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBodies[i],
                });
              } catch (e) {
                core.warning(`Could not post PR comment (${e.status ?? ''} ${e.message}); the result is still enforced by this job.`);
              }
            }
            for (let i = updateCount; i < existing.length; i++) {
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing[i].id,
                });
              } catch (e) {
                core.warning(`Could not delete stale PR comment (${e.status ?? ''} ${e.message}); the result is still enforced by this job.`);
              }
            }
